{{/*
  ADR 0176 decision 4, issue #3243: the end to end connector's identity on a
  test cluster. Installed by the test cluster's owner release (ADR 0129 sense)
  through `curie cluster up --e2e-connector-identity`; off by default.

  The identity may act only in namespaces it created, and the test cluster
  enforces that, not connector code. Kubernetes RBAC cannot scope a create by
  object name or a grant by namespace label, so the grant is split in three:

  1. A cluster grant that holds NO read or write of any namespaced object and
     no cluster scoped write beyond namespaces: create, delete and read
     namespaces; create RoleBindings; and `bind` on exactly one ClusterRole.
  2. A ClusterRole with no cluster scoped effect that the identity binds to
     itself, with a RoleBinding, inside each namespace it creates. That
     RoleBinding is the ONLY source of namespaced reads and writes, so a
     namespace the identity did not create is unreadable to it: no binding, no
     access.
  3. A ValidatingAdmissionPolicy, matched to this one service account, that
     the API server evaluates on every write it makes:
       - a namespace create or delete is admitted only when the name carries
         the prefix and the namespace carries the ownership label;
       - a namespaced write (including the bootstrap RoleBinding) is admitted
         only inside a namespace carrying the prefix and the label;
       - every cluster scoped write other than that namespace create or delete
         is denied, as a second wall behind RBAC granting none;
       - a RoleBinding to the worker ClusterRole may name this identity alone,
         so the identity cannot hand its per namespace grant to another subject.

  RBAC's escalation check does the rest: inside an owned namespace the
  identity may bind only permissions it already holds there, and `bind` on the
  worker ClusterRole is the only role it can grant without holding it.
  Namespace UPDATE is granted nowhere, so the identity cannot relabel a
  namespace someone else created into its scope.
*/}}
{{- $cfg := .Values.e2eConnectorIdentity }}
{{- if $cfg.enabled }}
{{- $prefix := required "e2eConnectorIdentity.namespacePrefix is required" $cfg.namespacePrefix }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?-$" $prefix) }}
{{- fail (printf "e2eConnectorIdentity.namespacePrefix %q must be a lowercase DNS label ending in '-'" $prefix) }}
{{- end }}
{{- $labelKey := required "e2eConnectorIdentity.ownerLabel.key is required" $cfg.ownerLabel.key }}
{{- if not (regexMatch "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$" $labelKey) }}
{{- fail (printf "e2eConnectorIdentity.ownerLabel.key %q is not a valid label key" $labelKey) }}
{{- end }}
{{- $labelValue := default .Release.Name $cfg.ownerLabel.value }}
{{- if not (regexMatch "^[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$" $labelValue) }}
{{- fail (printf "e2eConnectorIdentity.ownerLabel.value %q is not a valid label value" $labelValue) }}
{{- end }}
{{- $name := printf "%s-e2e-connector" (include "curie.fullname" .) }}
{{- $sa := default $name $cfg.serviceAccountName }}
{{- $worker := printf "%s-namespace" $name }}
{{- $user := printf "system:serviceaccount:%s:%s" .Release.Namespace $sa }}
{{- $owned := printf "%s.metadata.name.startsWith('%s') && has(%s.metadata.labels) && '%s' in %s.metadata.labels && %s.metadata.labels['%s'] == '%s'" "%[1]s" $prefix "%[1]s" $labelKey "%[1]s" "%[1]s" $labelKey $labelValue }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-connector
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-cluster
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-connector
rules:
  # Create and delete are admitted only for prefixed, labelled namespaces by the
  # policy below. No update or patch: the identity cannot relabel a namespace.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # The bootstrap RoleBinding in a namespace it just created. The policy admits
  # it only inside an owned namespace.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]
  # The one role it may grant without holding it first.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: [{{ $worker | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-cluster
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-connector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# Bound only by a RoleBinding inside an owned namespace, never by a
# ClusterRoleBinding. Through a RoleBinding a wildcard reaches namespaced
# resources of that one namespace and nothing cluster scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $worker }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-connector
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}-scope
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-connector
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*/*"]
        operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
        scope: "*"
  matchConditions:
    - name: e2e-connector-identity
      expression: {{ printf "request.userInfo.username == '%s'" $user | quote }}
  validations:
    - expression: >-
        request.resource.group != '' || request.resource.resource != 'namespaces' ||
        ((!has(request.subResource) || request.subResource == '') &&
         ((request.operation == 'CREATE' && {{ printf $owned "object" }}) ||
          (request.operation == 'DELETE' && {{ printf $owned "oldObject" }})))
      message: {{ printf "the e2e connector may create or delete only namespaces named %s* labelled %s=%s" $prefix $labelKey $labelValue | quote }}
      reason: Forbidden
    - expression: >-
        (request.resource.group == '' && request.resource.resource == 'namespaces') ||
        (has(request.namespace) && request.namespace != '' && namespaceObject != null && {{ printf $owned "namespaceObject" }})
      message: {{ printf "the e2e connector may write only inside namespaces named %s* labelled %s=%s, and never a cluster scoped object" $prefix $labelKey $labelValue | quote }}
      reason: Forbidden
    - expression: >-
        request.resource.group != 'rbac.authorization.k8s.io' ||
        request.resource.resource != 'rolebindings' || request.operation == 'DELETE' ||
        object.roleRef.kind != 'ClusterRole' || object.roleRef.name != '{{ $worker }}' ||
        (has(object.subjects) && object.subjects.all(s, s.kind == 'ServiceAccount' &&
         s.name == '{{ $sa }}' && has(s.namespace) && s.namespace == '{{ .Release.Namespace }}'))
      message: {{ printf "a RoleBinding to %s may name only the e2e connector itself" $worker | quote }}
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-scope
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-connector
spec:
  policyName: {{ $name }}-scope
  validationActions: ["Deny"]
{{- end }}
